<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./b6.css">
</head>

<body>
    <section class="courses">
        <div class="container">

            <div class="course-grid">

                <div class="course-card">
                    <div class="course-thumb">
                        <span class="badge studying">Đang học</span>
                        <img src="https://picsum.photos/400/250?1" alt="">
                    </div>

                    <div class="course-body">
                        <span class="category">Thiết kế</span>
                        <h3>UI/UX Design Chuyên Nghiệp</h3>
                        <p class="teacher">Giảng viên: Trần Thị B</p>

                        <div class="progress">
                            <div class="progress-bar" style="width:20%"></div>
                        </div>

                        <div class="progress-info">
                            <span>7/35 bài học</span>
                            <span>20%</span>
                        </div>

                        <button class="btn primary">Tiếp tục học</button>
                    </div>
                </div>

                <div class="course-card">
                    <div class="course-thumb">
                        <span class="badge done">Hoàn thành</span>
                        <img src="https://picsum.photos/400/250?2" alt="">
                    </div>

                    <div class="course-body">
                        <span class="category">Marketing</span>
                        <h3>Digital Marketing Toàn Diện</h3>
                        <p class="teacher">Giảng viên: Lê Văn C</p>

                        <div class="progress">
                            <div class="progress-bar success" style="width:100%"></div>
                        </div>

                        <div class="progress-info">
                            <span>30/30 bài học</span>
                            <span>100%</span>
                        </div>

                        <button class="btn outline">Xem lại</button>
                    </div>
                </div>

                <div class="course-card">
                    <div class="course-thumb">
                        <span class="badge saved">Đã lưu</span>
                        <img src="https://picsum.photos/400/250?3" alt="">
                    </div>

                    <div class="course-body">
                        <span class="category">AI & Data</span>
                        <h3>Machine Learning Cơ Bản</h3>

                        <div class="meta">
                            <span>⏱ 50 giờ</span>
                            <span>⭐ 4.9 (756)</span>
                        </div>

                        <div class="price">
                            <strong>2,799,000đ</strong>
                            <del>3,999,000đ</del>
                        </div>

                        <button class="btn primary">Đăng ký ngay</button>
                    </div>
                </div>

            </div>
        </div>
    </section>

</body>

</html>
